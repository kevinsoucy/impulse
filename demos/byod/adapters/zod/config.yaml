# ZOD adapter config (BL-008).
#
# ZOD = Zenseact Open Dataset (Volvo Cars spinout, released 2023).
# License: CC BY-SA 4.0. ShareAlike applies to *published* derivative datasets
# only — internal Databricks demo use is unencumbered. Confirm with legal
# before publishing any derived ZOD data (e.g. customer-facing Delta Share).
#
# Variants:
#   sequences-mini  — 100 sequences, ~20 GB; suitable for local/dev demos
#   sequences-full  — 1473 sequences, ~250 GB; full release
adapter_name: zod

dataset_versions:
  - sequences-mini
  - sequences-full
default_version: sequences-mini

# Dataroot layout (post-extraction; matches the zod SDK's expected tree):
#   {dataroot}/
#     sequences/
#       000001/
#         annotations/object_detection_3d.json
#         camera_front_blur/{frame_id}.jpg
#         lidar_velodyne/{frame_id}.npy
#         radar/{frame_id}.npy
#         oxts.hdf5
#         calibration.json
#         metadata.json
dataroot_template: "{vroot}/raw/zod/{version}"

# OpenLABEL package metadata strings (03_per_event_detail.py).
openlabel:
  annotator: zod_ground_truth
  exporter: lakevision-demo/byod/adapters/zod
  stream_description_prefix: "ZOD "

# Format hints for notebook 08 (interactive visualization).
visualize_format:
  lidar_dtype: float32       # ZOD .npy LiDAR points are float32
  lidar_stride: 6            # x, y, z, intensity, diode_index, timestamp per point
  camera_reader: pil         # camera_front_blur/*.jpg → PIL.Image.open
  lidar_reader: npy_load     # np.load(path) → (N, 6) array

# Runtime python deps. h5py decodes OXTS HDF5; the zod SDK is optional sugar
# (the adapter reads the directory tree directly, mirroring the A2D2 pattern).
python_deps:
  - h5py>=3.0
