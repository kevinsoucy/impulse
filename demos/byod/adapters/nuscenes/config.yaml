# NuScenes adapter config.
#
# Consumed by demos/byod/lib/byod_config.py. The generic notebooks read this
# file via BYODConfig.for_adapter("nuscenes", ...) to learn about NuScenes-
# specific variants, dataroot layout, and OpenLABEL / visualize defaults.
adapter_name: nuscenes

# Variants the adapter knows how to ingest. The first is the default.
dataset_versions:
  - v1.0-mini
  - v1.0-trainval
default_version: v1.0-mini

# Where the extracted NuScenes data lives. {vroot} is
# /Volumes/{catalog}/{schema_prefix}_silver; {version} is the selected
# dataset_version from above.
dataroot_template: "{vroot}/raw/{version}"

# Strings injected into the OpenLABEL package metadata (03_per_event_detail.py).
openlabel:
  annotator: nuscenes_ground_truth
  exporter: adas-demo/byod/adapters/nuscenes
  stream_description_prefix: "NuScenes "

# Format hints for 04_visualize.py.
visualize_format:
  lidar_dtype: float32      # NuScenes LIDAR_TOP .bin files are float32
  lidar_stride: 5           # 5 floats per point: x, y, z, intensity, ring_index
  camera_reader: pil        # CAM_* are .jpg → PIL.Image.open
  lidar_reader: fromfile    # raw flat float32 array → np.fromfile

# No dataset SDK needed: the adapter reads the metadata JSON directly and uses
# only numpy, Pillow, and the stdlib (all on serverless env v4).
python_deps: []
