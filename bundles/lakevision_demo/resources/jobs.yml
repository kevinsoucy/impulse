# Jobs for the ADAS demo.
#
# bootstrap_job — runs 01_ingest with bootstrap_only=true (provision schemas /
#                 volumes / empty tables + write metadata via the selected
#                 adapter, then exit). Idempotent recovery step.
#
# run_all_job   — full pipeline: 01_ingest → 02_detect_events → 03_per_event_detail
#                 → 04_visualize. 04_visualize runs both the event walkthrough
#                 and the sensor KPI comparison.
#
# Compute: Databricks Serverless. The impulse + byod-demo wheels are built and
# uploaded by DAB via the bundle's `artifacts` block (see databricks.yml) and
# referenced here via ${workspace.root_path}/artifacts/.internal/. No manual
# `databricks fs cp` step is needed — `bundle deploy` handles it.
#
# Source of truth for serverless dependencies is THIS file. ../notebook_env.yml
# carries the same list in `environment_version: '4'` form for interactive
# notebook use (Environment side panel → Custom → notebook_env.yml). Keep them
# in lockstep when adding/removing deps.
#
# !!! WHEEL FILENAME DRIFT !!!
# The two wheel paths below are version-pinned. They MUST be edited in lockstep with:
#   - impulse repo's VERSION file (drives `databricks_impulse-<X.Y.Z>-...`)
#   - demos/byod/pyproject.toml `version = "..."` (drives `byod_demo-<X.Y.Z>-...`)
# When either bumps, `uv build --wheel` produces a NEW filename. The same
# pinning lives in ../notebook_env.yml — update BOTH on every version bump.
# Current pins: impulse 0.0.2, byod-demo 0.1.0.

resources:
  jobs:

    # ─────────────────────────────────────────────────────────────────────────
    # Bootstrap — table creation + metadata ingest only
    # ─────────────────────────────────────────────────────────────────────────
    bootstrap_job:
      name: "adas — bootstrap LakeVision tables + ingest metadata"
      description: "Runs 01_ingest with bootstrap_only=true: creates LakeVision tables from src/mda_query_engine/perception/schema and writes container_tags + channel_tags via the selected adapter. Idempotent."

      environments:
        - environment_key: serverless
          spec:
            client: "2"
            dependencies:
              - ${workspace.root_path}/artifacts/.internal/databricks_impulse-0.0.2-py3-none-any.whl
              - ${workspace.root_path}/artifacts/.internal/byod_demo-0.1.0-py3-none-any.whl
              # Pinned to serverless env v4 pre-installed versions so nuscenes-devkit
              # transitive resolution can't downgrade them (would break the pre-installed
              # pandas ABI: "numpy.dtype size changed, expected 96, got 88").
              - numpy==2.1.3
              - pandas==2.2.3
              - pyarrow==19.0.1
              - scipy==1.15.1
              - matplotlib==3.10.0
              # Pre-installed scikit-learn on serverless is built against
              # numpy 1.x ("cannot import name 'ComplexWarning' from
              # numpy.core.numeric"); override with a numpy-2.x build.
              - scikit-learn>=1.6,<2
              # 1.1.11 pins matplotlib<3.6, incompatible with the numpy-2.x stack
              # serverless ships. 1.1.9 resolves with matplotlib==3.10.0.
              - nuscenes-devkit==1.1.9
              # Serverless env v4 ships pydantic 1.x; mda_reporting uses
              # pydantic 2 APIs (`AfterValidator`). Pin explicitly so the
              # impulse wheel dep doesn't get silently dropped by the
              # resolver in favour of the pre-installed older version.
              - pydantic==2.11.7

      tasks:
        - task_key: ingest_bootstrap
          environment_key: serverless
          notebook_task:
            notebook_path: ../../../demos/byod/01_ingest.py
            base_parameters:
              adapter: ${var.adapter}
              dataset_version: ${var.dataset_version}
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              bootstrap_only: "true"

    # ─────────────────────────────────────────────────────────────────────────
    # Full pipeline — 4 tasks, one per customer-narrative beat
    # ─────────────────────────────────────────────────────────────────────────
    run_all_job:
      name: "adas — end-to-end (ingest → detect → per-event detail → visualize)"
      description: "Runs the full demo pipeline on serverless. ~25 min on NuScenes mini, longer on other adapters/variants."

      environments:
        - environment_key: serverless
          spec:
            client: "2"
            dependencies:
              - ${workspace.root_path}/artifacts/.internal/databricks_impulse-0.0.2-py3-none-any.whl
              - ${workspace.root_path}/artifacts/.internal/byod_demo-0.1.0-py3-none-any.whl
              - numpy==2.1.3
              - pandas==2.2.3
              - pyarrow==19.0.1
              - scipy==1.15.1
              - matplotlib==3.10.0
              - scikit-learn>=1.6,<2
              - nuscenes-devkit==1.1.9
              - PyYAML
              - pydantic==2.11.7

      tasks:

        - task_key: t01_ingest
          environment_key: serverless
          notebook_task:
            notebook_path: ../../../demos/byod/01_ingest.py
            base_parameters:
              adapter: ${var.adapter}
              dataset_version: ${var.dataset_version}
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}

        - task_key: t02_detect_events
          depends_on:
            - task_key: t01_ingest
          environment_key: serverless
          notebook_task:
            notebook_path: ../../../demos/byod/02_detect_events.py
            base_parameters:
              adapter: ${var.adapter}
              dataset_version: ${var.dataset_version}
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}

        - task_key: t03_per_event_detail
          depends_on:
            - task_key: t02_detect_events
          environment_key: serverless
          notebook_task:
            notebook_path: ../../../demos/byod/03_per_event_detail.py
            base_parameters:
              adapter: ${var.adapter}
              dataset_version: ${var.dataset_version}
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}

        - task_key: t04_visualize
          depends_on:
            - task_key: t03_per_event_detail
          environment_key: serverless
          notebook_task:
            notebook_path: ../../../demos/byod/04_visualize.py
            base_parameters:
              adapter: ${var.adapter}
              dataset_version: ${var.dataset_version}
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
